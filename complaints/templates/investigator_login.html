{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-5">
        <div class="card shadow-lg border-danger">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0 font-weight-bold">INVESTIGATOR PORTAL</h4>
                <small class="text-muted text-uppercase tracking-wider">Authorized Investigator Access Only</small>
            </div>
            <div class="card-body p-4 bg-light">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger small py-2">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-danger btn-block btn-lg shadow-sm font-weight-bold mt-4">
                        Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
