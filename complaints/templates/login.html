{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center font-weight-bold">Login</h3>
                <p class="text-muted text-center small">Access the CyberGuard portal to manage your reports.</p>
                <hr>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary btn-block shadow-sm">Sign In</button>
                </form>
                <div class="mt-4 text-center">
                    <p class="mb-0">New victim? <a href="{% url 'register' %}" class="text-primary font-weight-bold">Create an account</a></p>
                    <p class="small"><a href="{% url 'home' %}" class="text-muted">Return to Homepage</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
